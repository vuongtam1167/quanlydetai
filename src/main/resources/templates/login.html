<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Đăng nhập - Hệ thống Quản lý đề tài</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body { background-color: #f4f6f9; }
        .login-card { max-width: 400px; margin: 100px auto; border-radius: 10px; }
    </style>
</head>
<body>
    <div class="container">
        <div class="card login-card shadow">
            <div class="card-header bg-primary text-white text-center py-3">
                <h4 class="mb-0">Đăng nhập hệ thống</h4>
            </div>
            <div class="card-body p-4">
                <div th:if="${param.error}" class="alert alert-danger">
                    Tên đăng nhập hoặc mật khẩu không chính xác!
                </div>
                <div th:if="${param.logout}" class="alert alert-success">
                    Bạn đã đăng xuất thành công.
                </div>
                
                <form th:action="@{/login}" method="post">
                    <div class="mb-3">
                        <label class="form-label fw-bold">Tên đăng nhập (MSSV/Mã GV)</label>
                        <input type="text" name="username" class="form-control" required autofocus>
                    </div>
                    <div class="mb-4">
                        <label class="form-label fw-bold">Mật khẩu</label>
                        <input type="password" name="password" class="form-control" required>
                    </div>
                    <button type="submit" class="btn btn-primary w-100 fw-bold">ĐĂNG NHẬP</button>
                </form>
            </div>
        </div>
    </div>
</body>
</html>
