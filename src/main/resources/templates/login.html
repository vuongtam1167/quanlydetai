<!doctype html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Đăng nhập | HCM-UTE</title>
    <link rel="icon" type="image/png" th:href="@{/images/logo.png}" />
    <link rel="stylesheet" th:href="@{/css/ute.css}" />
  </head>
  <body class="login-page">
    <div class="login-wrap">
      <img class="login-logo" th:src="@{/images/logo.png}" alt="HCM-UTE" />
      <h1 class="login-school">
        TRƯỜNG ĐẠI HỌC CÔNG NGHỆ KỸ THUẬT<br />TP.HCM
      </h1>

      <div class="login-card">
        <h2>ĐĂNG NHẬP</h2>
        <div class="sub">
          Hệ thống quản lý đề tài - Khoa Công nghệ Thông tin
        </div>

        <div class="alert alert-danger" th:if="${param.error}">
          ⚠️ Tên đăng nhập hoặc mật khẩu không chính xác (hoặc tài khoản đã bị
          khóa).
        </div>
        <div class="alert alert-success" th:if="${param.logout}">
          Bạn đã đăng xuất thành công.
        </div>

        <form th:action="@{/login}" method="post">
          <div class="float-field">
            <input
              type="text"
              id="username"
              name="username"
              placeholder=" "
              required
              autofocus
              autocomplete="username"
            />
            <label for="username">Tên đăng nhập</label>
          </div>
          <div class="float-field">
            <input
              type="password"
              id="password"
              name="password"
              placeholder=" "
              required
              autocomplete="current-password"
            />
            <label for="password">Mật khẩu</label>
          </div>
          <button
            type="submit"
            class="btn btn-primary btn-block"
            style="height: 42px"
          >
            Đăng nhập
          </button>
        </form>

        <details class="demo-accounts" th:if="${showDemo}">
          <summary>Tài khoản demo (mật khẩu: 123456)</summary>
          <div class="demo-list">
            <button type="button" data-fill-user="admin">
              admin<small>Quản trị viên</small>
            </button>
            <button type="button" data-fill-user="truongkhoa_cnnt">
              truongkhoa_cnnt<small>Trưởng khoa</small>
            </button>
            <button type="button" data-fill-user="truongbomon_ktpm">
              truongbomon_ktpm<small>Trưởng bộ môn</small>
            </button>
            <button type="button" data-fill-user="gv01">
              gv01<small>Giảng viên</small>
            </button>
            <button type="button" data-fill-user="sv01">
              sv01<small>Sinh viên (nhóm trưởng)</small>
            </button>
            <button type="button" data-fill-user="sv02">
              sv02<small>Sinh viên (thành viên)</small>
            </button>
          </div>
        </details>
      </div>
    </div>
    <script th:src="@{/js/ute.js}"></script>
  </body>
</html>
