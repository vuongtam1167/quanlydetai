<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Chấm điểm & Nhận xét</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
    <div th:replace="~{fragments/navbar :: navbar}"></div>

    <div class="container mt-4">
        <h3 class="fw-bold text-primary mb-4">Danh sách Đề tài được phân công chấm điểm</h3>

        <!-- Bảng danh sách các nhóm cần chấm -->
        <div class="card shadow-sm border-0 mb-4">
            <div class="card-body p-0">
                <table class="table table-hover table-bordered mb-0 align-middle">
                    <thead class="table-primary text-center">
                        <tr>
                            <th>Tên Đề Tài</th>
                            <th>Nhóm Thực Hiện</th>
                            <th>Link Báo Cáo (Github/Drive)</th>
                            <th>Điểm Đánh Giá</th>
                            <th>Thao Tác</th>
                        </tr>
                    </thead>
                    <tbody>
                        <!-- Vòng lặp lấy danh sách phân công chấm điểm theo model[cite: 2] -->
                        <tr th:each="assignment : ${assignments}">
                            <td class="fw-bold" th:text="${assignment.topic.title}">Xây dựng web ABC</td>
                            <td th:text="${assignment.group.groupName}">Nhóm 1</td>
                            <td class="text-center">
                                <a th:href="${assignment.submission.sourceCodeUrl}" target="_blank" class="btn btn-sm btn-outline-info">Xem bài nộp</a>
                            </td>
                            <td class="text-center fw-bold text-danger" th:text="${assignment.score != null ? assignment.score : 'Chưa chấm'}">
                                Chưa chấm
                            </td>
                            <td class="text-center">
                                <button type="button" class="btn btn-sm btn-success" data-bs-toggle="modal" th:data-bs-target="'#gradeModal' + ${assignment.id}">
                                    Nhập điểm
                                </button>
                            </td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </div>

        <!-- Modal nhập điểm cho từng assignment -->
        <div th:each="assignment : ${assignments}" class="modal fade" th:id="'gradeModal' + ${assignment.id}" tabindex="-1">
            <div class="modal-dialog">
                <div class="modal-content border-0 shadow">
                    <form th:action="@{/giangvien/cham-diem/{id}(id=${assignment.id})}" method="post">
                        <div class="modal-header bg-success text-white py-3">
                            <h5 class="modal-title fw-bold">Chấm điểm Phản biện / Hội đồng</h5>
                            <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal"></button>
                        </div>
                        <div class="modal-body p-4">
                            <div class="mb-3">
                                <label class="form-label fw-bold">Điểm số (0 - 10)</label>
                                <input type="number" step="0.1" min="0" max="10" name="score" class="form-control" required th:value="${assignment.score}">
                            </div>
                            <div class="mb-3">
                                <label class="form-label fw-bold">Nhận xét chi tiết</label>
                                <textarea name="comments" class="form-control" rows="4" placeholder="Đánh giá ưu nhược điểm..." required th:text="${assignment.comments}"></textarea>
                            </div>
                        </div>
                        <div class="modal-footer bg-light">
                            <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Đóng</button>
                            <button type="submit" class="btn btn-success fw-bold">Xác nhận điểm</button>
                        </div>
                    </form>
                </div>
            </div>
        </div>

    </div>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
