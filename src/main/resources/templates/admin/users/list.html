<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      th:replace="~{fragments/layout :: layout('Tài khoản', ~{::main})}">
<body>
<main>
    <div th:replace="~{fragments/components :: pageTitle('QUẢN LÝ TÀI KHOẢN')}"></div>
    <div class="card">
        <form method="get" th:action="@{/admin/users}" class="flex gap-1 wrap mb-2">
            <input type="search" name="q" th:value="${q}" class="form-control" style="max-width:320px" placeholder="Tìm theo tên đăng nhập, họ tên...">
            <select name="role" class="form-control" style="max-width:240px" onchange="this.form.submit()">
                <option value="">Tất cả vai trò</option>
                <option th:each="r : ${roleLabels}" th:value="${r.key}" th:text="${r.value}" th:selected="${r.key == role}"></option>
            </select>
            <button type="submit" class="btn btn-primary">Tìm</button>
        </form>
        <div class="table-wrap">
            <table class="ute-table">
                <thead><tr><th>Tên đăng nhập</th><th>Họ và tên</th><th>Vai trò</th><th>Trạng thái</th><th>Thao tác</th></tr></thead>
                <tbody>
                <tr th:each="u : ${users}">
                    <td><strong th:text="${u.username()}">sv01</strong></td>
                    <td th:text="${u.fullName()}">Nguyễn Văn A</td>
                    <td><span class="badge badge-blue" th:text="${u.roleLabel()}">Sinh viên</span></td>
                    <td>
                        <span class="badge badge-green" th:if="${u.enabled()}">Đang hoạt động</span>
                        <span class="badge badge-red" th:unless="${u.enabled()}">Đã khóa</span>
                    </td>
                    <td style="white-space:nowrap">
                        <form th:action="@{/admin/users/{id}/toggle(id=${u.id()})}" method="post" style="display:inline">
                            <button type="submit" class="btn btn-outline btn-sm" th:text="${u.enabled()} ? 'Khóa' : 'Mở khóa'">Khóa</button>
                        </form>
                        <form th:action="@{/admin/users/{id}/reset-password(id=${u.id()})}" method="post" style="display:inline"
                              data-confirm="Đặt lại mật khẩu của tài khoản này về 123456?">
                            <button type="submit" class="btn btn-warning btn-sm">Đặt lại mật khẩu</button>
                        </form>
                    </td>
                </tr>
                <tr th:if="${#lists.isEmpty(users)}"><td colspan="5" class="text-center muted" style="padding:28px">Không có tài khoản phù hợp.</td></tr>
                </tbody>
            </table>
        </div>
    </div>
</main>
</body>
</html>
