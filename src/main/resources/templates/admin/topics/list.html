<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      th:replace="~{fragments/layout :: layout('Phê duyệt đề tài', ~{::main})}">
<body>
<main>
    <div th:replace="~{fragments/components :: pageTitle('PHÊ DUYỆT ĐỀ TÀI (GIAI ĐOẠN 1)')}"></div>

    <div class="tabs">
        <a th:each="s : ${statusLabels}" class="tab" style="text-decoration:none"
           th:classappend="${s.key == status} ? 'active'"
           th:href="@{/admin/topics(status=${s.key},roundId=${roundId})}">
            <span th:text="${s.value}">Trạng thái</span>
            <span class="badge badge-gray" th:text="${counts.getOrDefault(s.key, 0L)}">0</span>
        </a>
    </div>

    <div class="card">
        <form method="get" th:action="@{/admin/topics}" class="flex gap-1 wrap center-y mb-2">
            <input type="hidden" name="status" th:value="${status}">
            <label class="form-label mb-0">Đợt đăng ký:</label>
            <select name="roundId" class="form-control" style="width:320px" onchange="this.form.submit()">
                <option value="">Tất cả các đợt</option>
                <option th:each="r : ${rounds}" th:value="${r.id()}" th:text="${r.name()}" th:selected="${r.id() == roundId}"></option>
            </select>
        </form>

        <div class="table-wrap">
            <table class="ute-table">
                <thead><tr>
                    <th>Mã</th><th>Tên đề tài</th><th>Bộ môn</th><th>GV hướng dẫn</th><th>Đợt</th><th>Trạng thái</th><th>Thao tác</th>
                </tr></thead>
                <tbody>
                <tr th:each="t : ${topics}">
                    <td><strong th:text="${t.code()}">DT001</strong></td>
                    <td>
                        <span th:text="${t.title()}">Tên đề tài</span>
                        <div class="help" th:if="${t.note() != null}" th:text="'Ghi chú: ' + ${t.note()}"></div>
                    </td>
                    <td th:text="${t.departmentName()}">CNPM</td>
                    <td th:text="${t.advisors()}">GV A</td>
                    <td th:text="${t.roundName()}">KLTN</td>
                    <td><span class="badge" th:classappend="${t.statusClass()}" th:text="${t.statusLabel()}">Trạng thái</span></td>
                    <td style="min-width:230px">
                        <th:block th:if="${t.waitingDean()}">
                            <form th:action="@{/admin/topics/{id}/approve(id=${t.id()})}" method="post" style="display:inline">
                                <button type="submit" class="btn btn-success btn-sm">✔ Duyệt</button>
                            </form>
                            <details style="display:inline-block;vertical-align:top">
                                <summary class="btn btn-danger btn-sm" style="list-style:none;display:inline-flex">✖ Từ chối</summary>
                                <form th:action="@{/admin/topics/{id}/reject(id=${t.id()})}" method="post" style="margin-top:8px">
                                    <input type="text" name="reason" class="form-control" placeholder="Lý do từ chối..." required>
                                    <button type="submit" class="btn btn-danger btn-sm mt-1">Xác nhận từ chối</button>
                                </form>
                            </details>
                        </th:block>
                        <span class="muted" th:unless="${t.waitingDean()}">—</span>
                    </td>
                </tr>
                <tr th:if="${#lists.isEmpty(topics)}"><td colspan="7" class="text-center muted" style="padding:28px">Không có đề tài nào ở mục này.</td></tr>
                </tbody>
            </table>
        </div>
    </div>
</main>
</body>
</html>
