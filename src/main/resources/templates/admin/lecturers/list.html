<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      th:replace="~{fragments/layout :: layout('Giảng viên', ~{::main})}">
<body>
<main>
    <div class="page-title">
        <h1>DANH MỤC GIẢNG VIÊN</h1>
        <div class="actions"><a class="btn btn-primary" th:href="@{/admin/lecturers/new}">+ Thêm giảng viên</a></div>
    </div>
    <div class="card">
        <form method="get" th:action="@{/admin/lecturers}" class="flex gap-1 wrap mb-2">
            <input type="search" name="q" th:value="${q}" class="form-control" style="max-width:320px" placeholder="Tìm theo tên, mã, email...">
            <select name="departmentId" class="form-control" style="max-width:300px" onchange="this.form.submit()">
                <option value="">Tất cả bộ môn</option>
                <option th:each="d : ${departments}" th:value="${d.id}" th:text="${d.name}" th:selected="${d.id == departmentId}"></option>
            </select>
            <button type="submit" class="btn btn-primary">Tìm</button>
        </form>
        <div class="table-wrap">
            <table class="ute-table">
                <thead><tr><th>Mã GV</th><th>Họ và tên</th><th>Học hàm/vị</th><th>Bộ môn</th><th>Email</th><th>Tài khoản</th><th>Thao tác</th></tr></thead>
                <tbody>
                <tr th:each="l : ${lecturers}">
                    <td><strong th:text="${l.lecturerCode}">GV001</strong></td>
                    <td th:text="${l.fullName}">Nguyễn Văn A</td>
                    <td th:text="${l.academicRank}">TS.</td>
                    <td th:text="${l.department.name}">CNPM</td>
                    <td th:text="${l.email}">a@hcmute.edu.vn</td>
                    <td><span th:text="${l.user.username}">gv01</span>
                        <span class="badge badge-blue" th:if="${l.user.role.name() == 'TRUONG_BO_MON'}">Trưởng BM</span>
                        <span class="badge badge-warn" th:if="${l.user.role.name() == 'TRUONG_KHOA'}">Trưởng khoa</span>
                        <span class="badge badge-red" th:if="${!l.user.enabled}">Đã khóa</span></td>
                    <td style="white-space:nowrap">
                        <a class="btn btn-outline btn-sm" th:href="@{/admin/lecturers/{id}/edit(id=${l.id})}">Sửa</a>
                        <form th:action="@{/admin/lecturers/{id}/delete(id=${l.id})}" method="post" style="display:inline"
                              data-confirm="Xóa giảng viên này cùng tài khoản đăng nhập?">
                            <button type="submit" class="btn btn-danger btn-sm">Xóa</button>
                        </form>
                    </td>
                </tr>
                <tr th:if="${#lists.isEmpty(lecturers)}"><td colspan="7" class="text-center muted" style="padding:28px">Không có giảng viên phù hợp.</td></tr>
                </tbody>
            </table>
        </div>
    </div>
</main>
</body>
</html>
