<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      th:replace="~{fragments/layout :: layout('Đợt đăng ký', ~{::main})}">
<body>
<main>
    <div class="page-title">
        <h1>QUẢN LÝ ĐỢT ĐĂNG KÝ ĐỀ TÀI</h1>
        <div class="actions"><a class="btn btn-primary" th:href="@{/admin/rounds/new}">+ Tạo đợt mới</a></div>
    </div>

    <div class="card">
        <form method="get" th:action="@{/admin/rounds}" class="flex gap-1 wrap center-y mb-2">
            <label class="form-label mb-0">Lọc theo loại:</label>
            <select name="type" class="form-control" style="width:260px" onchange="this.form.submit()">
                <option value="">Tất cả các loại</option>
                <option th:each="t : ${typeLabels}" th:value="${t.key}" th:text="${t.value}" th:selected="${t.key == type}"></option>
            </select>
        </form>
        <div class="table-wrap">
            <table class="ute-table">
                <thead><tr>
                    <th>Tên đợt</th><th>Loại</th><th>GĐ1 - GV đề xuất</th><th>GĐ2 - SV đăng ký</th>
                    <th>Tiến độ</th><th>Đề tài</th><th>Nhóm</th><th>Điểm</th><th>Thao tác</th>
                </tr></thead>
                <tbody>
                <tr th:each="r : ${rounds}">
                    <td><strong th:text="${r.name()}">KLTN HK1</strong></td>
                    <td><span class="badge badge-gray" th:text="${r.typeLabel()}">KLTN</span></td>
                    <td th:text="${#temporals.format(r.lecturerStart(), 'dd/MM/yyyy') + ' → ' + #temporals.format(r.lecturerEnd(), 'dd/MM/yyyy')}"></td>
                    <td th:text="${#temporals.format(r.studentStart(), 'dd/MM/yyyy') + ' → ' + #temporals.format(r.studentEnd(), 'dd/MM/yyyy')}"></td>
                    <td><span class="badge" th:classappend="${r.phaseClass()}" th:text="${r.phaseLabel()}">Đang mở</span></td>
                    <td th:text="${topicCounts.getOrDefault(r.id(), 0L)}">0</td>
                    <td th:text="${groupCounts.getOrDefault(r.id(), 0L)}">0</td>
                    <td><span class="badge" th:classappend="${r.published()} ? 'badge-green' : 'badge-gray'" th:text="${r.published()} ? 'Đã công bố' : 'Chưa công bố'"></span></td>
                    <td style="white-space:nowrap">
                        <a class="btn btn-outline btn-sm" th:href="@{/admin/rounds/{id}/edit(id=${r.id()})}">Sửa</a>
                        <form th:action="@{/admin/rounds/{id}/delete(id=${r.id()})}" method="post" style="display:inline"
                              data-confirm="Xóa đợt đăng ký này? Chỉ xóa được khi đợt chưa có đề tài/nhóm/hội đồng.">
                            <button type="submit" class="btn btn-danger btn-sm">Xóa</button>
                        </form>
                    </td>
                </tr>
                <tr th:if="${#lists.isEmpty(rounds)}"><td colspan="9" class="text-center muted" style="padding:28px">Chưa có đợt đăng ký nào.</td></tr>
                </tbody>
            </table>
        </div>
    </div>
</main>
</body>
</html>
