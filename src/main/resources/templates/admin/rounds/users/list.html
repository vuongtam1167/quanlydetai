<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Quản lý Danh mục Người dùng</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
    <div th:replace="~{fragments/navbar :: navbar}"></div>

    <div class="container mt-4">
        <div class="d-flex justify-content-between align-items-center mb-4">
            <h3 class="fw-bold text-primary">Quản lý Tài Khoản & Danh Mục</h3>
            <button class="btn btn-primary fw-bold" data-bs-toggle="modal" data-bs-target="#addUserModal">+ Thêm Người Dùng</button>
        </div>

        <div class="card shadow-sm border-0">
            <div class="card-body p-0">
                <table class="table table-hover mb-0 align-middle">
                    <thead class="table-dark text-center">
                        <tr>
                            <th>Tên đăng nhập</th>
                            <th>Quyền (Role)</th>
                            <th>Trạng thái</th>
                            <th>Thao tác</th>
                        </tr>
                    </thead>
                    <tbody>
                        <tr th:each="user : ${users}">
                            <td class="fw-bold px-3" th:text="${user.username}">admin</td>
                            <td class="text-center">
                                <span class="badge bg-info text-dark" th:text="${user.role.name()}">ADMIN</span>
                            </td>
                            <td class="text-center">
                                <span class="badge bg-success" th:if="${user.enabled}">Hoạt động</span>
                                <span class="badge bg-danger" th:unless="${user.enabled}">Bị khóa</span>
                            </td>
                            <td class="text-center">
                                <a th:href="@{/admin/users/{id}/edit(id=${user.id})}" class="btn btn-sm btn-outline-primary">Sửa</a>
                            </td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
