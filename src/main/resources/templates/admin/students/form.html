<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      th:replace="~{fragments/layout :: layout('Sinh viên', ~{::main})}">
<body>
<main>
    <div class="page-title">
        <h1 th:text="${form.id == null} ? 'THÊM SINH VIÊN' : 'SỬA SINH VIÊN'">THÊM SINH VIÊN</h1>
    </div>
    <div class="alert alert-danger" th:if="${formError}" th:text="${formError}"></div>
    <div class="card" style="max-width:820px">
        <form th:action="@{/admin/students/save}" th:object="${form}" method="post">
            <input type="hidden" th:field="*{id}">
            <div class="form-row">
                <div class="form-group">
                    <label class="form-label">MSSV <span class="req">*</span></label>
                    <input type="text" class="form-control" th:field="*{studentCode}" th:readonly="${form.id != null}" placeholder="VD: 21110001">
                    <span class="field-error" th:errors="*{studentCode}"></span>
                    <span class="help" th:if="${form.id == null}">MSSV cũng là tên đăng nhập.</span>
                </div>
                <div class="form-group">
                    <label class="form-label">Họ và tên <span class="req">*</span></label>
                    <input type="text" class="form-control" th:field="*{fullName}">
                    <span class="field-error" th:errors="*{fullName}"></span>
                </div>
            </div>
            <div class="form-row">
                <div class="form-group">
                    <label class="form-label">Email <span class="req">*</span></label>
                    <input type="email" class="form-control" th:field="*{email}">
                    <span class="field-error" th:errors="*{email}"></span>
                </div>
                <div class="form-group">
                    <label class="form-label">Số điện thoại</label>
                    <input type="text" class="form-control" th:field="*{phone}">
                    <span class="field-error" th:errors="*{phone}"></span>
                </div>
            </div>
            <div class="form-row">
                <div class="form-group">
                    <label class="form-label">Lớp <span class="req">*</span></label>
                    <input type="text" class="form-control" th:field="*{className}" placeholder="VD: 21110CL1">
                    <span class="field-error" th:errors="*{className}"></span>
                </div>
                <div class="form-group">
                    <label class="form-label">Mật khẩu</label>
                    <input type="password" class="form-control" th:field="*{password}" autocomplete="new-password"
                           th:placeholder="${form.id == null} ? 'Để trống: mật khẩu mặc định 123456' : 'Để trống: giữ nguyên mật khẩu cũ'">
                </div>
            </div>
            <div class="flex gap-1" style="justify-content:flex-end">
                <a class="btn btn-outline" th:href="@{/admin/students}">Hủy</a>
                <button type="submit" class="btn btn-primary">Lưu sinh viên</button>
            </div>
        </form>
    </div>
</main>
</body>
</html>
