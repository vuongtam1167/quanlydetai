<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <meta charset="UTF-8">
</head>
<body>
    <nav th:fragment="navbar" class="navbar navbar-expand-lg navbar-dark bg-primary shadow-sm">
        <div class="container">
            <a class="navbar-brand fw-bold" href="/">🎓 Quản Lý Đề Tài</a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav me-auto">
                    <li class="nav-item"><a class="nav-link" href="/">Trang chủ</a></li>
                    <li class="nav-item"><a class="nav-link" href="/topics">Danh sách Đề tài</a></li>
                    
                    <!-- Dành cho Admin/Trưởng khoa (Quản lý đợt, công bố kết quả) -->
                    <li class="nav-item" sec:authorize="hasAnyRole('ADMIN', 'TRUONG_KHOA')">
                        <a class="nav-link" href="/admin/rounds">Quản lý Đợt ĐK</a>
                    </li>
                    
                    <!-- Dành cho Sinh viên (Tra cứu điểm) -->
                    <li class="nav-item" sec:authorize="hasRole('SINH_VIEN')">
                        <a class="nav-link text-warning fw-bold" href="/sinhvien/diem">Tra cứu điểm</a>
                    </li>
                </ul>
                <div class="d-flex align-items-center">
                    <!-- Hiển thị tên người dùng và Role -->
                    <span class="text-light me-3">
                        Xin chào, <strong sec:authentication="name">User</strong>
                        (<span sec:authentication="principal.authorities">ROLE</span>)
                    </span>
                    <form th:action="@{/logout}" method="post" class="m-0">
                        <button class="btn btn-light btn-sm fw-bold" type="submit">Đăng xuất</button>
                    </form>
                </div>
            </div>
        </div>
    </nav>
</body>
</html>
