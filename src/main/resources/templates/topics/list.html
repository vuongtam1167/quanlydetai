<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <meta charset="UTF-8">
    <title>Danh sách Đề tài</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
    <div th:replace="~{fragments/navbar :: navbar}"></div>

    <div class="container mt-4">
        <div class="d-flex justify-content-between align-items-center mb-4">
            <h3 class="fw-bold">Danh sách Đề tài được công bố (Giai đoạn 2)</h3>
            <!-- Chỉ GV hoặc Admin mới thấy nút Đề xuất đề tài[cite: 3] -->
            <a sec:authorize="hasAnyRole('GIANG_VIEN', 'TRUONG_BO_MON', 'ADMIN')" 
               th:href="@{/topics/new}" class="btn btn-success fw-bold">+ Đề xuất Đề tài mới (GĐ1)</a>
        </div>

        <div class="card shadow-sm border-0">
            <div class="card-body p-0">
                <table class="table table-hover table-bordered mb-0">
                    <thead class="table-primary text-center">
                        <tr>
                            <th>Mã ĐT</th>
                            <th>Tên Đề Tài</th>
                            <th>GV Hướng Dẫn</th>
                            <th>Trạng Thái</th>
                            <th>Thao Tác</th>
                        </tr>
                    </thead>
                    <tbody>
                        <!-- Vòng lặp in danh sách đề tài[cite: 1] -->
                        <tr th:each="t : ${topics}">
                            <td class="text-center fw-bold" th:text="${t.code}">DT01</td>
                            <td th:text="${t.title}">Xây dựng hệ thống ABC</td>
                            <td th:text="${t.createdBy.fullName}">Nguyễn Văn A</td>
                            <td class="text-center">
                                <span class="badge bg-success" th:if="${t.status.name() == 'APPROVED'}">Đã duyệt</span>
                                <span class="badge bg-warning" th:if="${t.status.name() == 'PENDING'}">Chờ duyệt</span>
                            </td>
                            <td class="text-center">
                                <!-- Nút đăng ký dành cho Nhóm trưởng Sinh viên -->
                                <form sec:authorize="hasRole('SINH_VIEN')" th:action="@{/topics/{id}/register(id=${t.id})}" method="post" class="d-inline">
                                    <button class="btn btn-sm btn-primary">Đăng ký nhóm</button>
                                </form>

                                <!-- Nút xóa chỉ dành cho Admin (Yêu cầu phân quyền khắt khe)[cite: 3] -->
                                <form sec:authorize="hasRole('ADMIN')" th:action="@{/topics/{id}/delete(id=${t.id})}" method="post" class="d-inline">
                                    <button class="btn btn-sm btn-danger" onclick="return confirm('Chắc chắn xóa?')">Xóa</button>
                                </form>
                            </td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>
</body>
</html>
