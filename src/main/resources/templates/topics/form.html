<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Đề xuất Đề tài</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body { background-color: #f8f9fa; }
        .form-card { max-width: 800px; margin: 30px auto; }
        .err { color: #dc3545; font-size: 0.875em; margin-top: 0.25rem; }
    </style>
</head>
<body>
    <div th:replace="~{fragments/navbar :: navbar}"></div>

    <div class="container">
        <div class="card form-card shadow-sm border-0">
            <div class="card-header bg-success text-white py-3">
                <h4 class="mb-0 fw-bold" th:text="${topic.id == null} ? 'Đề xuất Đề tài mới (GĐ1)' : 'Cập nhật Đề tài'">Đề xuất Đề tài</h4>
            </div>
            <div class="card-body p-4">
                <!-- Form binding với th:object và th:field[cite: 2] -->
                <form th:object="${topic}" method="post" 
                      th:action="${topic.id == null} ? @{/topics} : @{/topics/{id}(id=${topic.id})}">
                    
                    <div class="row mb-3">
                        <div class="col-md-4">
                            <label class="form-label fw-bold">Mã đề tài</label>
                            <input type="text" class="form-control" th:field="*{code}" placeholder="VD: DT001">
                            <div class="err" th:errors="*{code}"></div>
                        </div>
                        <div class="col-md-8">
                            <label class="form-label fw-bold">Tên đề tài</label>
                            <input type="text" class="form-control" th:field="*{title}" placeholder="Nhập tên đề tài...">
                            <div class="err" th:errors="*{title}"></div>
                        </div>
                    </div>

                    <div class="mb-3">
                        <label class="form-label fw-bold">Mô tả tóm tắt</label>
                        <textarea class="form-control" th:field="*{description}" rows="4" placeholder="Mô tả mục tiêu và nội dung..."></textarea>
                        <div class="err" th:errors="*{description}"></div>
                    </div>

                    <div class="mb-3">
                        <label class="form-label fw-bold">Yêu cầu công nghệ / Kỹ năng</label>
                        <textarea class="form-control" th:field="*{requirements}" rows="2" placeholder="VD: Java, Spring Boot, MySQL..."></textarea>
                    </div>

                    <div class="row mb-4">
                        <div class="col-md-6">
                            <label class="form-label fw-bold">Số lượng sinh viên tối đa</label>
                            <select class="form-select" th:field="*{maxMembers}">
                                <option value="3">3 Sinh viên</option>
                                <option value="4">4 Sinh viên</option>
                                <option value="5">5 Sinh viên</option>
                            </select>
                        </div>
                    </div>

                    <div class="d-flex justify-content-end border-top pt-3">
                        <a th:href="@{/topics}" class="btn btn-secondary me-2 fw-bold">Hủy bỏ</a>
                        <button type="submit" class="btn btn-success fw-bold">Lưu Đề Tài</button>
                    </div>
                </form>
            </div>
        </div>
    </div>
</body>
</html>
